name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: wedding
          POSTGRES_PASSWORD: wedding
          POSTGRES_DB: wedding_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U wedding -d wedding_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    defaults:
      run:
        working-directory: backend
    env:
      PG_URL: postgresql+psycopg://wedding:wedding@localhost:5432/wedding_test
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: "3.12"
      - run: uv sync --frozen
      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .
      - name: Tests (SQLite)
        run: uv run pytest
      - name: Tests (PostgreSQL)
        run: TEST_DATABASE_URL=$PG_URL uv run pytest
      - name: Migrations apply cleanly and match the models
        run: DATABASE_URL=$PG_URL uv run alembic upgrade head && DATABASE_URL=$PG_URL uv run alembic check

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Type-check and build
        run: npm run build

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: "3.12"
      - run: uv sync --frozen
        working-directory: backend
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            e2e/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm ci && npx playwright install --with-deps chromium
        working-directory: e2e
      - name: End-to-end tests (real API, worker and browser)
        run: npm test
        working-directory: e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-output
          path: e2e/.output

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build all images
        run: docker compose build
      - name: Start the stack (with Mailpit to catch email)
        run: docker compose --profile dev up -d
      - name: Smoke test the running deployment
        run: python3 deploy/smoke_test.py http://localhost:8080 http://localhost:8025
      - name: Logs on failure
        if: failure()
        run: docker compose --profile dev logs
