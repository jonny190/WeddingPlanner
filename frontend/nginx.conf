# Wedding Planner web app: serves the built SPA and proxies the API.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Image uploads are limited to 8 MB by the API; leave room for multipart overhead.
    client_max_body_size 10m;

    # Compression for text assets (HTML, JS, CSS, JSON, SVG).
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/csv application/json application/javascript text/javascript
               application/xml image/svg+xml;

    # Basic security headers.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # Docker's DNS. Resolving per request (rather than once at start-up) means a recreated
    # API container with a new IP is picked up without restarting nginx.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api:8000;

    # The FastAPI backend (the "api" service in docker compose).
    location /api/ {
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 60s;
    }

    # Vite's hashed build output never changes, so it can be cached for a year.
    # (add_header here replaces the server-level headers, so they are repeated.)
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        access_log off;
    }

    # The app shell must always be revalidated so new deploys are picked up.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
    }

    # Client-side routes (/weddings/..., /rsvp/<token>, /i/<token>) fall back to the SPA.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
