# Response headers every page and asset carries. Included from nginx.conf wherever
# add_header is used, because nginx drops the server-level headers in any location that
# sets its own.
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
# Only this origin may serve scripts, styles, fonts, images and API calls. The app ships
# its own fonts, so no third-party host is needed. 'unsafe-inline' for styles is required
# by React's style attributes (the card designer positions every layer inline).
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; frame-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
